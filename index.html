<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Materiale PdRugby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- OVERLAY LOGIN TEMPORANEO -->
<div id="loginOverlay" class="login-overlay">
  <div class="login-card">
    <div class="brand-mark" style="justify-content: center; margin-bottom: 15px;">
      <span>PD</span><b>RUGBY</b>
    </div>
    <h2>Accesso Riservato</h2>
    <p>Inserisci la password per consultare il materiale della squadra.</p>
    <form id="loginForm">
      <input type="password" id="passwordInput" placeholder="Password di accesso" required autocomplete="current-password">
      <button type="submit">Accedi</button>
      <div id="loginError" class="login-error hidden">Password errata. Riprova.</div>
    </form>
  </div>
</div>

<div class="app-shell">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark"><span>PD</span><b>RUGBY</b></div><div class="brand-tag">EQUIPMENT MANAGER</div></div>
  <nav class="side-nav">
    <button class="nav-item active" data-view="dashboard"><span>⌂</span><b>Dashboard</b><i>›</i></button>
    <button class="nav-item" data-view="players"><span>●●</span><b>Giocatori</b><i>›</i></button>
    <button class="nav-item" data-view="wheelchairs"><span>▱</span><b>Carrozzine</b><i>›</i></button>
    <button class="nav-item" data-view="wheels"><span>◉</span><b>Ruote</b><i>›</i></button>
    <button class="nav-item" data-view="bags"><span>▣</span><b>Borse</b><i>›</i></button>
    <button class="nav-item" data-view="inventory"><span>▤</span><b>Inventario</b><i>›</i></button>
    <button class="nav-item" data-view="map"><span>◇</span><b>Mappa</b><i>›</i></button>
    <button class="nav-item" data-view="checklist"><span>✓</span><b>Check-list</b><i>›</i></button>
  </nav>
  <div class="sidebar-promo"><div class="promo-wheel">◉</div><strong>Più forti<br><em>insieme.</em></strong></div>
</aside>
<div class="main">
  <header class="topbar">
    <button id="mobileMenu" class="mobile-menu" aria-label="Apri menu">☰</button>
    <div class="search-wrap">
      <span>⌕</span>
      <input id="search" type="search" placeholder="Cerca giocatore, materiale, borsa, ruota..." autocomplete="off">
      <kbd>CTRL K</kbd>
    </div>
    <div class="top-actions">
      <div class="readonly top-readonly">SOLA LETTURA</div>
      <div class="user-chip">
        <div class="user-avatar">PD</div>
        <div><b>PdRugby</b><small>Team Manager</small></div>
      </div>
    </div>
  </header>
  <main class="page" id="content"></main>
</div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
