<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PdRugby · Equipment Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><span>PD</span><b>RUGBY</b></div>
      <div class="brand-tag">ONE TEAM, ONE GOAL</div>
    </div>
    <nav id="sideNav" class="side-nav">
      <button class="nav-item active" data-view="dashboard"><span>▦</span><b>Dashboard</b></button>
      <button class="nav-item" data-view="players"><span>●●</span><b>Giocatori</b><i>›</i></button>
      <button class="nav-item" data-view="wheelchairs"><span>♿</span><b>Carrozzine</b></button>
      <button class="nav-item" data-view="wheels"><span>◉</span><b>Ruote</b></button>
      <button class="nav-item" data-view="bags"><span>▣</span><b>Borse</b></button>
      <button class="nav-item" data-view="inventory"><span>▤</span><b>Inventario</b></button>
      <button class="nav-item" data-view="map"><span>⌖</span><b>Mappa</b></button>
      <button class="nav-item" data-view="checklist"><span>✓</span><b>Check-list</b></button>
    </nav>
    <div class="sidebar-promo"><div class="promo-wheel">◉</div><strong>Più forti<br><em>insieme.</em></strong></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="mobile-menu" id="mobileMenu" aria-label="Menu">☰</button>
      <div class="search-wrap"><span>⌕</span><input id="search" type="search" placeholder="Cerca giocatore, materiale, borsa, ruota..." autocomplete="off"><kbd>⌘ K</kbd></div>
      <div class="top-actions"><button class="icon-btn" aria-label="Notifiche">♧<i></i></button><div class="user-chip"><div class="user-avatar">♿</div><div><b>PdRugby</b><small>Team Manager</small></div><span>⌄</span></div></div>
    </header>

    <div class="page">
      <section id="content"></section>
    </div>
  </main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
